name: Install Solana

# release.solana.com is no longer reachable, so this wraps the shared
# metaplex-foundation/actions/install-solana action (used by mpl-core, genesis,
# etc.) and always installs from the Anza release host. Anza only hosts
# v1.17.25 and newer, which is why the pinned version is 1.17.x.
inputs:
  solana_version:
    description: Version of Solana to install (must be hosted on release.anza.xyz)
    required: true
    default: 1.17.25

runs:
  using: "composite"
  steps:
    - uses: metaplex-foundation/actions/install-solana@v1
      with:
        version: ${{ inputs.solana_version }}
        base_url: https://release.anza.xyz
        cache: "true"
